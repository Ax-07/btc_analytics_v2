[project]
name = "btc-analytics-v2"
version = "0.1.0"
description = "Plateforme d’analyse causale et structurelle du marché Bitcoin"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.2",
    "ccxt==4.5.77",
    "psycopg[binary]==3.3.5",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.10,<0.13"

[tool.uv.build-backend]
module-name = "btc_analytics"
module-root = "backend/src"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: requires external infrastructure such as PostgreSQL",
    "binance_integration: requires public network access to Binance Spot through CCXT",
]

[tool.ruff]
target-version = "py314"
src = ["backend/src"]
line-length = 100
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["backend/src", "backend/tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["backend/src"]
