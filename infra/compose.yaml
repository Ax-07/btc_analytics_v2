services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: btc_analytics
      POSTGRES_USER: btc_analytics
      POSTGRES_PASSWORD: btc_analytics_dev
    ports:
      - "${BTC_ANALYTICS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc_analytics -d btc_analytics"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - btc_analytics_postgres_data:/var/lib/postgresql

volumes:
  btc_analytics_postgres_data:
